name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, unit tests, build
    runs-on: namespace-profile-linux-4cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb # v2.1.3
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check (vp fmt)
        run: bun run fmt:check

      - name: Lint (vp lint)
        run: bun run lint

      - name: svelte-check (0 errors / 0 warnings)
        run: bun run check

      - name: Type declarations (present, fresh, exported)
        run: bun run check:types

      - name: Unit tests
        run: bun test ./checks ./scripts

      - name: Checker dogfood (kit-ui-check on src/demo)
        run: bun run check:usage

      - name: Build demo gallery
        run: bun run build

      # Fails if the gallery can paint before its stylesheet and fonts load.
      - uses: kenn-io/actions/first-paint@b523fb403607f01de5eec5f4556c7668544c70fe # main
        with:
          dist: dist

  browser:
    name: Browser tests
    runs-on: namespace-profile-linux-4cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb # v2.1.3
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Chromium download cached on the lockfile (which pins the
      # @playwright/test version); OS deps install fresh each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Chromium OS dependencies
        run: bunx playwright install-deps chromium

      - name: Run browser suite
        run: bun run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
