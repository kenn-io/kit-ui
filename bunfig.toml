# Scope `bun test` discovery to the unit tests; tests/browser/*.spec.ts are
# Playwright specs (run via `bun run test:browser`) and crash under bun's runner.
[test]
root = "checks"

[install]
# Bun installs only versions published at least 7 days ago (604800 seconds),
# matching the shared Renovate release-age preset in kenn-io/actions.
minimumReleaseAge = 604800
